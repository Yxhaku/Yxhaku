<svg viewBox="0 0 900 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#070a0e" />
    </linearGradient>

    <pattern id="matrix-green" width="4.0" height="4.0" patternUnits="userSpaceOnUse">
      <rect width="1.5" height="1.5" rx="0.3" fill="#00FF66" opacity="0.48" />
    </pattern>

    <pattern id="matrix-cyan" width="4.0" height="4.0" patternUnits="userSpaceOnUse">
      <rect width="1.5" height="1.5" rx="0.3" fill="#00E5FF" opacity="0.48" />
    </pattern>

    <radialGradient id="soft-falloff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <mask id="mask-left-orb">
      <circle cx="390" cy="110" r="160" fill="url(#soft-falloff)" />
    </mask>

    <mask id="mask-right-orb">
      <circle cx="510" cy="110" r="160" fill="url(#soft-falloff)" />
    </mask>

    <filter id="ambient-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36" />
    </filter>

    <filter id="text-backdrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#080c10" flood-opacity="0.9" />
    </filter>

    <style>
      @keyframes active-drift-1 {
        0% { transform: translate(0px, 0px) scale(1); }
        25% { transform: translate(22px, -14px) scale(1.06); }
        50% { transform: translate(-16px, 16px) scale(0.94); }
        75% { transform: translate(14px, 10px) scale(1.03); }
        100% { transform: translate(0px, 0px) scale(1); }
      }

      @keyframes active-drift-2 {
        0% { transform: translate(0px, 0px) scale(1); }
        25% { transform: translate(-22px, 14px) scale(0.95); }
        50% { transform: translate(18px, -18px) scale(1.06); }
        75% { transform: translate(-12px, -8px) scale(1.02); }
        100% { transform: translate(0px, 0px) scale(1); }
      }

      @keyframes pulse-cursor {
        0%, 45% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .orb-motion-1 {
        animation: active-drift-1 7.5s ease-in-out infinite;
        transform-origin: 390px 110px;
      }

      .orb-motion-2 {
        animation: active-drift-2 8.5s ease-in-out infinite;
        transform-origin: 510px 110px;
      }

      .cursor {
        animation: pulse-cursor 0.9s infinite;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 3px;
        fill: #FFFFFF;
      }

      .sub-text {
        font-family: 'SF Mono', Monaco, 'Fira Code', 'JetBrains Mono', Consolas, monospace;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.8px;
        fill: #00FF66;
      }
    </style>
  </defs>

  <rect width="900" height="220" rx="8" fill="url(#canvas-bg)" stroke="#21262d" stroke-width="1" />

  <g style="mix-blend-mode: screen;">
    <g class="orb-motion-1">
      <circle cx="390" cy="110" r="115" fill="#00FF66" opacity="0.14" filter="url(#ambient-blur)" />
      <circle cx="390" cy="110" r="160" fill="url(#matrix-green)" mask="url(#mask-left-orb)" />
    </g>

    <g class="orb-motion-2">
      <circle cx="510" cy="110" r="115" fill="#00E5FF" opacity="0.14" filter="url(#ambient-blur)" />
      <circle cx="510" cy="110" r="160" fill="url(#matrix-cyan)" mask="url(#mask-right-orb)" />
    </g>
  </g>

  <g text-anchor="middle">
    <text x="450" y="104" class="title-text" filter="url(#text-backdrop)">KIRILL KOPKIN</text>
    <text x="450" y="142" class="sub-text" filter="url(#text-backdrop)">&gt; systems // zero-knowledge // cloud<tspan class="cursor" fill="#00FF66">_</tspan></text>
  </g>
</svg>
